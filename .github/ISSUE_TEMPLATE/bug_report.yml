name: Bug report
description: Report a reproducible problem in CodeChat.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve CodeChat. Do not include passwords, `.env` contents, private code, or personal conversation data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: A clear, concise description of the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Start CodeChat with...
        2. Open...
        3. Enter...
        4. Observe...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Local environment
      description: Include operating system, Node.js, browser, PostgreSQL, Ollama, and model versions when relevant.
      placeholder: macOS 15, Node.js 22, Chrome 134, PostgreSQL 17, Ollama 0.x, llama3.2:3b
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove credentials, private code, and personal data before attaching anything.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials, private code, and personal data.
          required: true
        - label: I can reproduce this on the current target branch.
          required: true
