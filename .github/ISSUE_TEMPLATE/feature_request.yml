name: Feature request
description: Suggest a focused improvement to CodeChat.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. A clear use case makes design and implementation tradeoffs easier to evaluate.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain who experiences the problem and when it occurs.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the workflow or outcome you would like, without requiring a specific implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches you considered.
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Editor and code context
        - Chat and streaming
        - History and persistence
        - Ollama models
        - Setup and configuration
        - Accessibility and interface
        - Documentation and developer experience
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: This request describes one focused user outcome.
          required: true
